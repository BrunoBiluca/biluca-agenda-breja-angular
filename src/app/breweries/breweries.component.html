<h2 class="text-2xl font-bold text-gray-800 mb-4">Cervejarias</h2>

@if (breweries() === undefined) {
  <div aria-label="loading" class="m-4 text-center">
    <i class="ph ph-circle-notch animate-spin"></i>
    <p class="text-sm text-gray-500">Carregando...</p>
  </div>
} @else if (breweries()!.length === 0) {
  <p class="m-4 text-center">Nenhuma cervejaria encontrada</p>
} @else {
  <div
    class="grid max-w-full grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4"
    role="list"
  >
    @for (b of breweries(); track b.id) {
      <app-brewery-item [brewery]="b" role="listitem" />
    }
  </div>
  <div class="flex justify-center flex-col gap-2">
    @if (loadingMore()) {
      <div aria-label="loading" class="m-4 text-center">
        <i class="ph ph-circle-notch animate-spin"></i>
        <p class="text-sm text-gray-500">Carregando...</p>
      </div>
    }
    @if (hasMore()) {
      <button
        class="bg-amber-300 flex items-center gap-2 rounded-lg border border-gray-500 px-3 py-2 transition hover:cursor-pointer hover:bg-gray-100 mt-4 justify-center"
        type="button"
        (click)="loadMore()"
      >
        Carregar mais
      </button>
    }
  </div>
}
