<a routerLink="/{{ brewery().id }}">
  <hlm-card class="relative mx-auto w-full max-w-sm pt-0 cursor-pointer" role="listitem">
    <img class="relative z-20 aspect-video w-full object-cover brightness-60 grayscale dark:brightness-40"
      src="https://placehold.co/600x400" alt="" />
    <hlm-card-header>
      <h3 hlmCardTitle>{{ brewery().name }}</h3>
      <p hlmCardDescription>{{ brewery().address_1 }}</p>
    </hlm-card-header>
  </hlm-card>
</a>
