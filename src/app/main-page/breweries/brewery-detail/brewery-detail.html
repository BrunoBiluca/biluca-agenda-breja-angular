<div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center bg-black/50">
  <div class="modal-content mx-2 w-150 rounded-lg border border-white bg-white" data-slot="modal">
    <hlm-card role="listitem" class="p-0">
      <div class="relative">
        <button class="absolute top-2 right-2 hover:cursor-pointer">
          <!-- <XCircleIcon size={30} /> -->
        </button>
        <img src="https://placehold.co/600x200" class="rounded-t-lg" alt="" />
      </div>
      <hlm-card-header class="p-6">
        <h1>{{ brewery()?.name }}</h1>
        <div class="flex flex-col gap-3 text-base text-gray-500">
          <p>{{ brewery()?.name }} - {{ brewery()?.website_url }}</p>
          <p class="flex items-center gap-2">
            {{ brewery()?.address_1 }}, {{ brewery()?.city }}, {{ brewery()?.state_province }},
            {{ brewery()?.postal_code }}
            -
            {{ brewery()?.country }}
          </p>
        </div>
      </hlm-card-header>

      <hr class="my-4 border-gray-200" />
      <hlm-card-footer class="flex items-center justify-between p-6">
        <button
          class="border-orange-base bg-orange-base hover:bg-orange-light flex items-center gap-2 rounded-lg border px-3 py-2 transition hover:cursor-pointer"
        >
          Agendar visita
        </button>
        <button
          class="flex items-center gap-2 rounded-lg border border-gray-500 bg-gray-200 px-3 py-2 transition hover:cursor-pointer hover:bg-gray-100"
          (click)="closeModal()"
        >
          Fechar
        </button>
      </hlm-card-footer>
    </hlm-card>
  </div>
</div>
