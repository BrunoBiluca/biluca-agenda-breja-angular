<h2 class="text-2xl font-bold text-gray-800 mb-4">Cervejarias</h2>

@if (breweries() === undefined) {
  <div aria-label="loading" class="m-4 text-center">
    <i class="ph ph-circle-notch animate-spin"></i>
    <p>Carregando...</p>
  </div>
} @else if (breweries()!.length === 0) {
  <p class="m-4 text-center">Nenhuma cervejaria encontrada</p>
} @else {
  <div
    class="grid max-w-full grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4"
    role="list"
  >
    @for (b of breweries(); track $index) {
      <hlm-card class="relative mx-auto w-full max-w-sm pt-0" role="listitem">
        <img
          class="relative z-20 aspect-video w-full object-cover brightness-60 grayscale dark:brightness-40"
          src="https://placehold.co/600x400"
          alt=""
        />
        <hlm-card-header>
          <h3 hlmCardTitle>{{ b.name }}</h3>
          <p hlmCardDescription>{{ b.address_1 }}</p>
        </hlm-card-header>
      </hlm-card>
    }
  </div>
}
