<div class="flex h-screen w-full flex-row items-stretch justify-center bg-[#f8f7f6]">
  <div
    class="flex h-screen flex-1 items-center justify-center bg-[url('/images/cerveja-login-bg.jpg')] bg-cover bg-center text-center text-white"
  >
    <div class="w-md rounded-md bg-black/50 p-8">
      <h1 class="mb-4 text-5xl text-white text-shadow-lg">Brindes memoráveis começam aqui.</h1>
      <p class="text-white/80 text-shadow-lg">
        Descubra e agende visitas com seus amigos nas melhores cervejarias
      </p>
    </div>
  </div>
  <div class="flex h-screen flex-1 flex-col items-center justify-center">
    <div class="w-lg">
      <h2 class="mb-10 font-bold">Agenda da Breja</h2>
      <div class="mb-4">
        <h1 class="text-3xl">Crie sua conta</h1>
        <p class="text-[#8a6d4b]">Junte-se a nós para agendar a sua próxima visita!</p>
      </div>
      <div class="mb-4 flex flex-row bg-[#f3f1ef] p-1">
        <button
          type="button"
          class="flex-1 rounded-sm p-1 font-bold"
          [ngClass]="
            formType() === 'register' ? ['text-orange-base', 'bg-white'] : ['cursor-pointer']
          "
          (click)="formType.set('register')"
        >
          Cadastro
        </button>
        <button
          type="button"
          class="flex-1 rounded-sm p-1 font-bold"
          [ngClass]="formType() === 'login' ? ['text-orange-base', 'bg-white'] : ['cursor-pointer']"
          (click)="formType.set('login')"
        >
          Login
        </button>
      </div>
      <div class="flex flex-col gap-3">
        @if (formType() === 'register') {
          <app-register-form />
        }
        @if (formType() === 'login') {
          <app-login-form />
        }
      </div>
    </div>
  </div>
</div>
