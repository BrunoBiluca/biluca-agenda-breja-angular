<form class="space-y-4">
  <fieldset hlmFieldSet>
    <div hlmFieldGroup>
      <div hlmField>
        <label hlmFieldLabel for="name" class="mb-1">Nome completo</label>
        <input hlmInput id="name" type="text" placeholder="John Doe" />
        <hlm-field-error>Choose another username.</hlm-field-error>
      </div>
      <div hlmField>
        <label hlmFieldLabel for="email">E-mail</label>
        <input
          hlmInput
          id="email"
          type="text"
          placeholder="john_doe_99"
          class="border-[#e6e0db] text-[#8a6d4b]"
        />
        <hlm-field-error>Choose another username.</hlm-field-error>
      </div>
      <div hlmField>
        <label hlmFieldLabel for="password">Senha</label>
        <input
          hlmInput
          id="password"
          type="text"
          placeholder="john_doe_99"
          class="border-[#e6e0db] text-[#8a6d4b]"
        />
        <hlm-field-error>Choose another username.</hlm-field-error>
      </div>
    </div>
  </fieldset>
  <button hlmBtn type="submit" size="lg" class="w-full text-base disabled:opacity-50">
    Criar conta
  </button>
  <!-- {error && <FieldError>{error}</FieldError>} -->
</form>
